<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>我们的专属相册</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #fce4ec;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #d81b60;
        }

        .upload-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            margin: 5px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #d81b60;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #ad1457;
        }

        .delete-btn {
            background-color: #777;
            font-size: 12px;
            padding: 4px 8px;
            margin-top: 5px;
        }

        .delete-btn:hover {
            background-color: #555;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 250px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            margin: 10px 0 5px;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>💕 我们的专属相册 💕</h1>

    <!-- 上传区域 -->
    <div class="upload-box">
        <h3>上传新回忆</h3>
        <input type="text" id="titleInput" placeholder="给这张照片起个名字..."><br>
        <input type="file" id="fileInput" accept="image/*"><br>
        <input type="password" id="passwordInput" placeholder="输入暗号才能操作哦..."><br>
        <button onclick="uploadPhoto()">上传照片</button>
    </div>

    <!-- 照片展示区域 -->
    <div id="gallery" class="gallery"></div>

    <script>
        // 获取并显示照片
        async function loadPhotos() {
            const response = await fetch('/api/photos');
            const result = await response.json();
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (result.data.length === 0) {
                gallery.innerHTML = '<p>还没有照片，快上传第一张吧！</p>';
                return;
            }

            result.data.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.url}" alt="${photo.title}">
                    <h3>${photo.title}</h3>
                    <button class="delete-btn" onclick="deletePhoto(${photo.id})">删除</button>
                `;
                gallery.appendChild(card);
            });
        }

        // 上传照片
        async function uploadPhoto() {
            const title = document.getElementById('titleInput').value;
            const file = document.getElementById('fileInput').files[0];
            const password = document.getElementById('passwordInput').value;

            if (!title || !file || !password) {
                alert("名字、图片和暗号都要填哦！");
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('file', file);
            formData.append('password', password);

            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (response.ok) {
                alert('上传成功！');
                document.getElementById('titleInput').value = '';
                document.getElementById('fileInput').value = '';
                loadPhotos();
            } else {
                alert(result.detail); // 弹出后端返回的报错信息（比如密码错误）
            }
        }

        // 删除照片
        async function deletePhoto(id) {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                alert("请先在上方输入暗号，才能删除哦！");
                return;
            }

            if (!confirm("确定要删除这张照片吗？")) return;

            const response = await fetch(`/api/photos/${id}?password=${password}`, {
                method: 'DELETE'
            });

            const result = await response.json();
            if (response.ok) {
                alert('删除成功！');
                loadPhotos();
            } else {
                alert(result.detail); // 弹出密码错误等提示
            }
        }

        window.onload = loadPhotos;
    </script>
</body>

</html>
